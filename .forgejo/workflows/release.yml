name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # The job container (node:20-bookworm, our runner's default image) has
      # no docker CLI at all -- the runner mounts the host's docker.sock in
      # (container.docker_host: automount) but that only gives access to a
      # daemon, not the client binary. docker/setup-qemu-action and friends
      # all assume `docker` is already on PATH, so install it explicitly.
      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io jq

      # Our only runner is amd64-only (nuc); QEMU lets it cross-build arm64
      # (Raspberry Pi 4B) via emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # driver: docker (not the default docker-container) -- confirmed by
      # direct testing that Forgejo's container registry rejects the
      # docker-container driver's push with 403 Forbidden on the blob
      # existence-check (HEAD) request, regardless of attestation/provenance
      # settings. The classic docker driver's push doesn't hit this bug, but
      # it can't produce a multi-platform manifest list in one command, so
      # each platform is built+pushed separately below and combined via
      # `docker manifest create/push` instead of buildx's own multi-platform
      # push.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: forgejo.winar.to
          username: winarto
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build, push, and combine multi-arch images
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -eu
          TAG="${{ github.ref_name }}"

          build_and_push() {
            local image="$1" dockerfile="$2"
            for arch in amd64 arm64; do
              docker buildx build \
                --platform "linux/$arch" \
                --file "$dockerfile" \
                --build-arg "VERSION=$TAG" \
                --tag "forgejo.winar.to/winarto/$image:$TAG-$arch" \
                --push .
            done
            for tag in "$TAG" latest; do
              docker manifest create "forgejo.winar.to/winarto/$image:$tag" \
                "forgejo.winar.to/winarto/$image:$TAG-amd64" \
                "forgejo.winar.to/winarto/$image:$TAG-arm64"
              docker manifest push "forgejo.winar.to/winarto/$image:$tag"
            done
          }

          build_and_push update-detector ./Dockerfile
          build_and_push update-aggregator ./Dockerfile.aggregator

      # All three binaries are also published as plain standalone release
      # assets, not just the two Docker images above -- update-detector and
      # update-aggregator so install.sh can offer a native (no Docker)
      # install on WSL2, and update-detector-companion since it's
      # host-native and never containerized at all (it needs real root to
      # run apt-get). Go cross-compiles trivially without QEMU -- no
      # --platform needed, GOARCH alone controls the output binary's
      # architecture.
      #
      # Deliberately not `docker run -v "$PWD":/src` -- this runner's job
      # container talks to the *host's* Docker daemon (docker.sock mounted
      # in), so a bind mount is resolved against the host's filesystem, not
      # this container's. The job container's $PWD doesn't exist at that
      # same path on the host, so the mount silently ends up empty
      # ("go.mod not found"). `docker cp` goes over the Docker API instead
      # of a bind mount, so it's unaffected by that path mismatch.
      - name: Build native binaries
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            cid=$(docker create \
              -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH="$arch" \
              golang:1.22-alpine \
              sh -c "mkdir -p /out && cd /src \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector ./cmd/update-detector \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-aggregator ./cmd/update-aggregator \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector-companion ./cmd/update-detector-companion")
            # A single whole-directory copy, not one docker cp per
            # subpath -- docker cp only auto-creates missing destination
            # directories for a directory-to-nonexistent-dest copy, not for
            # a file landing under several nonexistent parent directories
            # (confirmed by testing: the per-path form fails with
            # "Could not find the file /src in container").
            docker cp . "$cid:/src"
            docker start -a "$cid"
            docker cp "$cid:/out/update-detector" "dist/update-detector-linux-$arch"
            docker cp "$cid:/out/update-aggregator" "dist/update-aggregator-linux-$arch"
            docker cp "$cid:/out/update-detector-companion" "dist/update-detector-companion-linux-$arch"
            docker rm "$cid" >/dev/null
          done

      # A separate secret from REGISTRY_TOKEN on purpose: REGISTRY_TOKEN only
      # needs write:package/read:package for the image pushes above, while
      # creating a release and uploading assets needs repository read/write
      # instead -- least-privilege, and one token's scope can't leak into
      # the other's blast radius.
      - name: Publish native binaries as release assets
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          API="https://forgejo.winar.to/api/v1/repos/winarto/update-detector"

          # Deliberately not `curl -f ... | jq ...`: on a failed request,
          # -f suppresses the body and jq silently gets empty input,
          # swallowing the real error -- release_id ends up empty and the
          # asset-upload calls below 404 on a malformed URL two steps
          # later, with no indication of what actually went wrong.
          # Capturing status/body separately surfaces the real failure.
          http_status=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            "$API/releases/tags/$TAG")

          if [ "$http_status" = "200" ]; then
            release_id=$(jq -r '.id' /tmp/release.json)
          elif [ "$http_status" = "404" ]; then
            http_status=$(curl -sS -o /tmp/release.json -w "%{http_code}" -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
              "$API/releases")
            if [ "$http_status" != "201" ]; then
              echo "failed to create release (http $http_status):" >&2
              cat /tmp/release.json >&2
              exit 1
            fi
            release_id=$(jq -r '.id' /tmp/release.json)
          else
            echo "failed to look up release (http $http_status):" >&2
            cat /tmp/release.json >&2
            exit 1
          fi

          for name in update-detector update-aggregator update-detector-companion; do
            for arch in amd64 arm64; do
              file="dist/$name-linux-$arch"
              http_status=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST \
                -H "Authorization: token $FORGEJO_TOKEN" \
                -F "attachment=@$file" \
                "$API/releases/$release_id/assets?name=$name-linux-$arch")
              if [ "$http_status" != "201" ]; then
                echo "failed to upload asset for $name/$arch (http $http_status):" >&2
                cat /tmp/asset.json >&2
                exit 1
              fi
            done
          done
