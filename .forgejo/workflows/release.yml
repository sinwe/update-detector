name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # The job container (node:20-bookworm, our runner's default image) has
      # no docker CLI at all -- the runner mounts the host's docker.sock in
      # (container.docker_host: automount) but that only gives access to a
      # daemon, not the client binary. docker/setup-qemu-action and friends
      # all assume `docker` is already on PATH, so install it explicitly.
      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io

      # Our only runner is amd64-only (nuc); QEMU lets it cross-build arm64
      # (Raspberry Pi 4B) via emulation. Slower than native, but keeps both
      # images published on every release without needing an arm64 runner.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: forgejo.winar.to
          username: winarto
          password: ${{ secrets.REGISTRY_TOKEN }}

      # provenance: false -- buildx's default provenance attestation feature
      # pushes extra OCI referrer blobs that Forgejo's container registry
      # rejects with 403 on the existence-check HEAD request. Confirmed by
      # testing: build succeeds, push fails only once attestation manifests
      # are involved.
      - name: Build and push update-detector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            forgejo.winar.to/winarto/update-detector:${{ github.ref_name }}
            forgejo.winar.to/winarto/update-detector:latest

      - name: Build and push update-aggregator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.aggregator
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            forgejo.winar.to/winarto/update-aggregator:${{ github.ref_name }}
            forgejo.winar.to/winarto/update-aggregator:latest
