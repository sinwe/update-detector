name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      # The job container (node:20-bookworm, our runner's default image) has
      # no docker CLI at all -- the runner mounts the host's docker.sock in
      # (container.docker_host: automount) but that only gives access to a
      # daemon, not the client binary. docker/setup-qemu-action and friends
      # all assume `docker` is already on PATH, so install it explicitly.
      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io

      # Our only runner is amd64-only (nuc); QEMU lets it cross-build arm64
      # (Raspberry Pi 4B) via emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # driver: docker (not the default docker-container) -- confirmed by
      # direct testing that Forgejo's container registry rejects the
      # docker-container driver's push with 403 Forbidden on the blob
      # existence-check (HEAD) request, regardless of attestation/provenance
      # settings. The classic docker driver's push doesn't hit this bug, but
      # it can't produce a multi-platform manifest list in one command, so
      # each platform is built+pushed separately below and combined via
      # `docker manifest create/push` instead of buildx's own multi-platform
      # push.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: forgejo.winar.to
          username: winarto
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build, push, and combine multi-arch images
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -eu
          TAG="${{ github.ref_name }}"

          build_and_push() {
            local image="$1" dockerfile="$2"
            for arch in amd64 arm64; do
              docker buildx build \
                --platform "linux/$arch" \
                --file "$dockerfile" \
                --tag "forgejo.winar.to/winarto/$image:$TAG-$arch" \
                --push .
            done
            for tag in "$TAG" latest; do
              docker manifest create "forgejo.winar.to/winarto/$image:$tag" \
                "forgejo.winar.to/winarto/$image:$TAG-amd64" \
                "forgejo.winar.to/winarto/$image:$TAG-arm64"
              docker manifest push "forgejo.winar.to/winarto/$image:$tag"
            done
          }

          build_and_push update-detector ./Dockerfile
          build_and_push update-aggregator ./Dockerfile.aggregator
