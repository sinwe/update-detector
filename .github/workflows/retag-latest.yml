name: Retag latest channel
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag to retag (e.g. v0.15.2-beta2)"
        required: true
        default: "v0.15.2-beta2"
permissions:
  contents: read
  packages: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag channel latests
        run: |
          set -eu
          TAG="${{ inputs.tag }}"
          echo "Retagging $TAG"
          # Determine channel like release.yml
          if [[ "$TAG" =~ -alpha[0-9]+$ ]]; then CH=alpha
          elif [[ "$TAG" =~ -beta[0-9]+$ ]]; then CH=beta
          elif [[ "$TAG" =~ -rc[0-9]+$ ]]; then CH=rc
          else CH=release; fi
          echo "Channel: $CH"
          for image in update-detector update-aggregator; do
            SRC="ghcr.io/sinwe/$image:$TAG"
            case "$CH" in
              alpha) docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-alpha $SRC ;;
              beta)  docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-alpha $SRC
                     docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-beta $SRC ;;
              rc)    docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-alpha $SRC
                     docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-beta $SRC
                     docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-rc $SRC ;;
              release) docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest $SRC
                       docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-alpha $SRC
                       docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-beta $SRC
                       docker buildx imagetools create --tag ghcr.io/sinwe/$image:latest-rc $SRC ;;
            esac
          done
