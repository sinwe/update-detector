name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch images
        run: |
          set -eu
          TAG="${{ github.ref_name }}"

          build_and_push() {
            image="$1" dockerfile="$2"
            docker buildx build \
              --platform "linux/amd64,linux/arm64" \
              --file "$dockerfile" \
              --build-arg "VERSION=$TAG" \
              --tag "ghcr.io/winarto/$image:$TAG" \
              --tag "ghcr.io/winarto/$image:latest" \
              --push .
          }

          build_and_push update-detector ./Dockerfile
          build_and_push update-aggregator ./Dockerfile.aggregator

      - name: Build native binaries
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            cid=$(docker create \
              -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH="$arch" \
              golang:1.22-alpine \
              sh -c "mkdir -p /out && cd /src \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector ./cmd/update-detector \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-aggregator ./cmd/update-aggregator \
                && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector-companion ./cmd/update-detector-companion")
            docker cp . "$cid:/src"
            docker start -a "$cid"
            docker cp "$cid:/out/update-detector" "dist/update-detector-linux-$arch"
            docker cp "$cid:/out/update-aggregator" "dist/update-aggregator-linux-$arch"
            docker cp "$cid:/out/update-detector-companion" "dist/update-detector-companion-linux-$arch"
            docker rm "$cid" >/dev/null
          done

          cid=$(docker create \
            -e CGO_ENABLED=0 -e GOOS=windows -e GOARCH=amd64 \
            golang:1.22-alpine \
            sh -c "mkdir -p /out && cd /src \
              && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector.exe ./cmd/update-detector \
              && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-aggregator.exe ./cmd/update-aggregator \
              && go build -ldflags \"-X update-detector/internal/version.Version=$TAG\" -o /out/update-detector-companion.exe ./cmd/update-detector-companion")
          docker cp . "$cid:/src"
          docker start -a "$cid"
          docker cp "$cid:/out/update-detector.exe" "dist/update-detector-windows-amd64.exe"
          docker cp "$cid:/out/update-aggregator.exe" "dist/update-aggregator-windows-amd64.exe"
          docker cp "$cid:/out/update-detector-companion.exe" "dist/update-detector-companion-windows-amd64.exe"
          docker rm "$cid" >/dev/null

      - name: Publish native binaries as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          API="https://api.github.com/repos/winarto/update-detector"

          http_status=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token $GITHUB_TOKEN" \
            "$API/releases/tags/$TAG")

          if [ "$http_status" = "200" ]; then
            release_id=$(jq -r '.id' /tmp/release.json)
          elif [ "$http_status" = "404" ]; then
            http_status=$(curl -sS -o /tmp/release.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
              "$API/releases")
            if [ "$http_status" != "201" ]; then
              echo "failed to create release (http $http_status):" >&2
              cat /tmp/release.json >&2
              exit 1
            fi
            release_id=$(jq -r '.id' /tmp/release.json)
          else
            echo "failed to look up release (http $http_status):" >&2
            cat /tmp/release.json >&2
            exit 1
          fi

          for name in update-detector update-aggregator update-detector-companion; do
            for arch in amd64 arm64; do
              file="dist/$name-linux-$arch"
              http_status=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -F "file=@$file" \
                "https://uploads.github.com/repos/winarto/update-detector/releases/$release_id/assets?name=$name-linux-$arch")
              if [ "$http_status" != "201" ]; then
                echo "failed to upload asset for $name/$arch (http $http_status):" >&2
                cat /tmp/asset.json >&2
                exit 1
              fi
            done

            asset_name="$name-windows-amd64.exe"
            file="dist/$asset_name"
            http_status=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -F "file=@$file" \
              "https://uploads.github.com/repos/winarto/update-detector/releases/$release_id/assets?name=$asset_name")
            if [ "$http_status" != "201" ]; then
              echo "failed to upload asset $asset_name (http $http_status):" >&2
              cat /tmp/asset.json >&2
              exit 1
            fi
          done
