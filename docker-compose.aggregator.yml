# Standalone compose file for the central aggregator. This runs once,
# wherever you want it (e.g. next to Homepage) — it's not per-host like
# docker-compose.yml. Agents connect out to it via AGGREGATOR_URL.
#
# If you want this aggregator to be self-updatable from its own /admin
# page (see README "Self-updating update-detector"), also run an agent +
# companion pair on this same host -- every self-update, including the
# aggregator's own, is executed by a companion, and a companion's
# identity always comes from an agent paired with it on the same host.
# A host running only the aggregator, as here, has no companion and so
# no way to execute that -- a real, deliberate limitation, not a bug.
services:
  update-aggregator:
    # For real deploys: `docker compose pull && docker compose up -d` uses
    # this published image (built by .forgejo/workflows/release.yml on
    # every `vX.Y.Z` tag). For local dev/testing: `docker compose up -d
    # --build` still builds from source and ignores the registry entirely.
    image: ghcr.io/winarto/update-aggregator:latest
    build:
      context: .
      dockerfile: Dockerfile.aggregator
    restart: unless-stopped
    environment:
      # Optional: alerts on companion apply results (e.g. "update applied
      # on web01"). Independent of each agent's own Telegram config.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Gates POST /admin/agents/{id}/apply -- unset (the default) disables
      # that endpoint entirely (501). Put the aggregator behind your own
      # auth (e.g. Authentik) and have it inject this header; the
      # aggregator checks it independently either way. See README.
      - ADMIN_APPLY_SHARED_SECRET=${ADMIN_APPLY_SHARED_SECRET:-}
    ports:
      - "9090:8080"
    volumes:
      - update-aggregator-data:/var/lib/update-aggregator

volumes:
  update-aggregator-data:
