openapi: 3.0.3
info:
  title: update-aggregator API
  description: >
    Central service update-detector agents push their status to. New agents
    are held as pending until approved via /admin; approved agents' data
    powers the /widgets/* endpoints for a Homepage dashboard.
    Also served live at GET /openapi.yaml on the running aggregator.
  version: "1.0"

security: []

servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8080"

paths:
  /enroll:
    post:
      summary: Agent self-registration (trust-on-first-contact)
      description: >
        Unauthenticated — an agent has nothing to prove on its very first
        contact. Creates a pending record for an unknown agent_id; for a
        known agent_id, confirms the token matches (idempotent re-announce)
        or reports a conflict if it doesn't.
      operationId: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Current approval status for this agent_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, approved, rejected]
        "400":
          description: Missing agent_id, hostname, or token
        "409":
          description: agent_id already registered with a different token

  /report:
    post:
      summary: Push a detection result
      description: >
        Accepted only for an approved agent presenting its correct token.
        Called after every local check cycle; failures should be logged by
        the agent, not treated as fatal — local detection/Gatus/Telegram
        must keep working regardless of the aggregator's reachability.
      operationId: report
      security:
        - agentToken: []
      parameters:
        - name: X-Agent-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: >
          Same Status shape update-detector serves at its own GET /status
          (see update-detector.yaml, Status schema, in this same directory).
        content:
          application/json:
            schema:
              $ref: "update-detector.yaml#/components/schemas/Status"
      responses:
        "200":
          description: Report accepted
        "401":
          description: Unknown agent or invalid token
        "403":
          description: Agent known but not (yet) approved

  /companion/stream:
    get:
      summary: SSE stream of apply Actions for a host-native companion
      description: >
        Long-lived Server-Sent-Events response (plain HTTP/1.1, one Action
        at a time, plus periodic ": heartbeat" comments). A companion
        process holds this connection open and reconnects with backoff if
        it drops; being connected here is what makes POST
        /admin/agents/{id}/apply succeed for that agent instead of 409ing.
      operationId: companionStream
      security:
        - agentToken: []
      parameters:
        - name: X-Agent-ID
          in: header
          required: true
          schema:
            type: string
        - name: X-Companion-Version
          in: header
          required: false
          description: The companion's own build version, shown on the admin page. Older companions that predate this simply omit it.
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream of Action payloads
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          description: Unknown agent or invalid token
        "403":
          description: Agent known but not (yet) approved

  /companion/result:
    post:
      summary: Report the outcome of a previously pushed Action
      description: >
        Recorded in a small in-memory per-agent action log (not persisted)
        and, if a notifier is configured, raises an alert (e.g. "update
        applied on web01").
      operationId: companionResult
      security:
        - agentToken: []
      parameters:
        - name: X-Agent-ID
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResult"
      responses:
        "200":
          description: Result recorded
        "400":
          description: Missing action_id
        "401":
          description: Unknown agent or invalid token
        "403":
          description: Agent known but not (yet) approved

  /companion/output:
    post:
      summary: Stream one action's live command output as it's produced
      description: >
        A single chunked (streaming) request body held open for the whole
        lifetime of the action named by action_id, one newline-delimited
        JSON {"action_id","line"} frame per output line. Best-effort and
        purely additive to the existing report/result flow -- if this
        never arrives, or drops mid-action (e.g. the companion process is
        killed while self-updating itself), the action's real outcome
        still arrives separately via POST /companion/result. action_id
        must match this agent's currently in-flight action (see
        POST /admin/agents/{id}/apply); a mismatch is rejected outright
        rather than silently ignored.
      operationId: companionOutput
      security:
        - agentToken: []
      parameters:
        - name: X-Agent-ID
          in: header
          required: true
          schema:
            type: string
        - name: action_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON, one {"action_id","line"} object per line.
      responses:
        "200":
          description: Stream ended (the body reached EOF)
        "400":
          description: Missing action_id
        "401":
          description: Unknown agent or invalid token
        "403":
          description: Agent known but not (yet) approved
        "409":
          description: action_id doesn't match this agent's currently in-flight action

  /admin/agents/{id}/output/stream:
    get:
      summary: SSE stream of one agent's live action output, for the admin page
      description: >
        Long-lived Server-Sent-Events response (plain HTTP/1.1, same
        shape as GET /companion/stream) that a browser holds open to
        watch one host's in-progress action. Events are "line" (one
        output line), "done" (the action's final result was recorded --
        the normal end of a stream), or "disconnected" (the companion's
        own POST /companion/output body ended without a prior "done" --
        notably, it was killed mid-action while self-updating itself).
        No history: a subscriber only sees lines from the moment it
        connects onward.
      operationId: adminOutputStream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream of line/done/disconnected events
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
                  line:
                    type: string

  /admin:
    get:
      summary: Approval dashboard (HTML)
      description: >
        Lists agents by Pending/Approved/Rejected with Approve/Reject/Revoke
        form actions. No authentication of its own — keep on a private
        network or behind your own reverse-proxy auth.
      operationId: getAdminPage
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /admin/agents/{id}/approve:
    post:
      summary: Approve a pending or rejected agent
      operationId: approveAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect back to /admin
        "404":
          description: Unknown agent id

  /admin/agents/{id}/reject:
    post:
      summary: Reject a pending agent, or revoke an approved one
      operationId: rejectAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect back to /admin
        "404":
          description: Unknown agent id

  /admin/agents/{id}/apply:
    post:
      summary: Trigger a package upgrade on one agent's host
      description: >
        Human-triggered, and gated by a shared secret (ADMIN_APPLY_SHARED_SECRET)
        checked independently of whatever reverse-proxy auth fronts this
        endpoint -- disabled entirely (501) until that secret is configured.
        Requires a companion currently connected via GET /companion/stream
        for this agent, and the companion independently re-validates any
        named packages against its own host's last-known pending upgrades
        before acting -- this endpoint alone does not grant arbitrary
        command execution even if the aggregator itself were compromised.
      operationId: applyAgentAction
      security:
        - adminApplySecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
      responses:
        "202":
          description: Action accepted and pushed to the connected companion
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
        "400":
          description: Invalid type, or packages missing for type=packages
        "403":
          description: Missing or invalid X-Admin-Apply-Secret
        "404":
          description: Unknown agent id, or agent not approved
        "409":
          description: No companion currently connected for this agent, or this agent already has an unresolved action in flight
        "501":
          description: Apply is disabled (ADMIN_APPLY_SHARED_SECRET not configured)

  /admin/agents/{id}/recheck:
    post:
      summary: Trigger an out-of-band detection cycle on one agent's host
      description: >
        Relayed through the connected companion the same way apply is,
        since the aggregator never reaches into an agent's network
        directly. Needs no shared secret, unlike apply -- it can't change
        anything on the host, only make it report what's already true
        sooner instead of waiting for the next CHECK_INTERVAL. Same trust
        model as the rest of /admin (approve/reject/view).
      operationId: recheckAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Recheck action accepted and pushed to the connected companion
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
        "404":
          description: Unknown agent id, or agent not approved
        "409":
          description: No companion currently connected for this agent, or this agent already has an unresolved action in flight

  /admin/agents/{id}/self-update:
    post:
      summary: Trigger a self-update of the agent, aggregator, or companion on one host
      description: >
        Gated by the same shared secret as apply -- self-update is at
        least as high-stakes, since updating the aggregator restarts the
        process serving this very request. Rejects (409) any
        component other than "aggregator" whose target_version is newer
        than this aggregator's own currently-running version, enforced
        server-side rather than just hidden in the UI, to avoid the kind
        of protocol confusion a newer agent talking to an older
        aggregator can cause. Relayed through the connected companion the
        same way apply is; Docker-based components are pulled and pinned
        to the exact target_version rather than whatever the image's
        existing tag currently resolves to.
      operationId: selfUpdateAgentAction
      security:
        - adminApplySecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfUpdateRequest"
      responses:
        "202":
          description: Action accepted and pushed to the connected companion
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id:
                    type: string
        "400":
          description: Invalid component, missing target_version, or target_version doesn't parse
        "403":
          description: Missing or invalid X-Admin-Apply-Secret
        "404":
          description: Unknown agent id, or agent not approved
        "409":
          description: No companion currently connected for this agent, this agent already has an unresolved action in flight, or target_version is newer than the aggregator's own version for a non-aggregator component
        "501":
          description: Self-update is disabled (ADMIN_APPLY_SHARED_SECRET not configured)

  /admin/self-update-channel:
    post:
      summary: Switch which release channel "latest available" self-update checks consider
      description: >
        Overrides SELF_UPDATE_INCLUDE_PRERELEASE at runtime and refreshes
        immediately, so a pre-release cut can be tested against a live
        fleet without editing the aggregator's env and restarting it.
        Resets back to SELF_UPDATE_INCLUDE_PRERELEASE's own value on the
        next aggregator restart, same as the version cache itself.
      operationId: setSelfUpdateChannel
      security:
        - adminApplySecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfUpdateChannelRequest"
      responses:
        "200":
          description: Channel switched (refresh_error is present if the immediate refresh failed, but the switch itself still took effect)
          content:
            application/json:
              schema:
                type: object
                properties:
                  include_prerelease:
                    type: boolean
                  refresh_error:
                    type: string
        "403":
          description: Missing or invalid X-Admin-Apply-Secret
        "501":
          description: Self-update is disabled (ADMIN_APPLY_SHARED_SECRET not configured, or no selfupdate.Client configured at all)

  /healthz:
    get:
      summary: Liveness/version check
      description: >
        Polled by the admin page's Jenkins-style banner after triggering a
        self-update of the aggregator itself, to know when it's actually
        back up and confirm which version it's now running.
      operationId: getHealthz
      responses:
        "200":
          description: Aggregator is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string

  /widgets/summary:
    get:
      summary: Fleet-wide totals for a Homepage "Custom API" widget
      description: Computed across approved agents only.
      operationId: getWidgetSummary
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"

  /widgets/hosts:
    get:
      summary: Per-host summaries for approved agents
      operationId: getWidgetHosts
      responses:
        "200":
          description: List of approved hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostSummary"

  /widgets/hosts/{hostname}:
    get:
      summary: One host's latest full report
      description: >
        Same JSON shape as an agent's own GET /status, so a Homepage widget
        config is identical whether it targets the aggregator or the agent
        directly. Looks up the most-recently-seen approved agent claiming
        this hostname.
      operationId: getWidgetHost
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The host's latest reported Status
          content:
            application/json:
              schema:
                $ref: "update-detector.yaml#/components/schemas/Status"
        "404":
          description: No approved agent with a report for this hostname yet

  /widgets/packages:
    get:
      summary: Fleet-wide list of pending package upgrades
      description: >
        Flattens every approved, reporting agent's pending package upgrades
        into one list, so a single Homepage widget (or any other consumer)
        can show "what needs updating" across the whole fleet without
        querying each host individually.
      operationId: getWidgetPackages
      parameters:
        - name: security
          in: query
          required: false
          description: If "true", only include packages flagged as security updates.
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: Pending packages across every approved host
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingPackage"

  /openapi.yaml:
    get:
      summary: This OpenAPI spec
      operationId: getOpenAPISpec
      responses:
        "200":
          description: OpenAPI 3.0 spec for this service
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: The agent's self-generated token, paired with its X-Agent-ID header.
    adminApplySecret:
      type: apiKey
      in: header
      name: X-Admin-Apply-Secret
      description: >
        Shared secret configured via ADMIN_APPLY_SHARED_SECRET. Intended to
        be injected by a reverse-proxy (e.g. Authentik) after successful
        human auth; the aggregator checks it independently either way.

  schemas:
    Action:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [packages, upgrade, full-upgrade, recheck, self-update]
        packages:
          type: array
          items:
            type: string
        component:
          type: string
          enum: [agent, aggregator, companion]
          description: Set only when type=self-update.
        target_version:
          type: string
          description: Set only when type=self-update.
        created_at:
          type: string
          format: date-time

    ActionResult:
      type: object
      required: [action_id]
      properties:
        action_id:
          type: string
        success:
          type: boolean
        message:
          type: string

    ApplyRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [packages, upgrade, full-upgrade]
        packages:
          type: array
          items:
            type: string
          description: Required (and non-empty) when type=packages; ignored otherwise.

    SelfUpdateRequest:
      type: object
      required: [component, target_version]
      properties:
        component:
          type: string
          enum: [agent, aggregator, companion]
        target_version:
          type: string
          example: v0.11.0

    SelfUpdateChannelRequest:
      type: object
      required: [include_prerelease]
      properties:
        include_prerelease:
          type: boolean

    EnrollRequest:
      type: object
      required: [agent_id, hostname, token]
      properties:
        agent_id:
          type: string
          description: Self-generated by the agent on first run (crypto/rand), persisted locally.
        hostname:
          type: string
          example: web01
        token:
          type: string
          description: Self-generated by the agent alongside agent_id. Stored server-side only as a sha256 hash.

    SummaryResponse:
      type: object
      properties:
        hosts_total:
          type: integer
        hosts_reporting:
          type: integer
          description: Approved hosts that have sent at least one report.
        hosts_ok:
          type: integer
        hosts_reboot_required:
          type: integer
        hosts_os_upgrade_available:
          type: integer
        packages_upgradable_total:
          type: integer
        packages_upgradable_security:
          type: integer
        generated_at:
          type: string
          format: date-time

    HostSummary:
      type: object
      properties:
        hostname:
          type: string
        agent_id:
          type: string
        has_report:
          type: boolean
        ok:
          type: boolean
        last_seen:
          type: string
          format: date-time
        upgradable_total:
          type: integer
        upgradable_security:
          type: integer
        reboot_required:
          type: boolean
        os_update_available:
          type: boolean

    PendingPackage:
      type: object
      required: [hostname, name, candidate_version]
      properties:
        hostname:
          type: string
          example: web01
        name:
          type: string
          example: curl
        current_version:
          type: string
          example: 7.81.0-1ubuntu1.15
        candidate_version:
          type: string
          example: 7.81.0-1ubuntu1.16
        security:
          type: boolean
