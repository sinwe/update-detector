services:
  update-detector:
    # For real deploys: `docker compose pull && docker compose up -d` uses
    # this published image (built by .forgejo/workflows/release.yml on
    # every `vX.Y.Z` tag). For local dev/testing: `docker compose up -d
    # --build` still builds from source and ignores the registry entirely.
    image: forgejo.winar.to/winarto/update-detector:latest
    build: .
    restart: unless-stopped
    # Recommended: set this explicitly per host so Gatus/Telegram messages
    # are unambiguous. Falls back to the shell's $HOSTNAME if unset.
    environment:
      - HOSTNAME_OVERRIDE=${HOSTNAME_OVERRIDE:-${HOSTNAME:-}}
      - CHECK_INTERVAL=6h
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFY_ON_STARTUP=false
      # Optional: point at a central update-aggregator (see
      # docker-compose.aggregator.yml) to show this host on a Homepage
      # dashboard. Purely additive — local /status, Gatus, and Telegram
      # keep working even if the aggregator is unreachable. Set via
      # AGGREGATOR_URL=http://aggregator-host:9090 in .env or the shell —
      # empty/unset means push mode stays off.
      - AGGREGATOR_URL=${AGGREGATOR_URL:-}
    ports:
      # Override with AGENT_PORT=<port> if 8080 is already taken on this
      # host (e.g. AGENT_PORT=8081 docker compose up -d).
      - "${AGENT_PORT:-8080}:8080"
    volumes:
      # Host apt/dpkg state, read-only. update-detector never writes to any
      # of these; its own writable apt cache lives in the named volume below.
      - /etc/apt/sources.list:/host/etc/apt/sources.list:ro
      - /etc/apt/sources.list.d:/host/etc/apt/sources.list.d:ro
      - /var/lib/dpkg:/host/var/lib/dpkg:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run:/host/var/run:ro
      # Optional: only present if update-manager-core is installed. Remove
      # this line if the path doesn't exist on your host — the agent
      # defaults to LTS-only upgrade checking when it's missing.
      - /etc/update-manager:/host/etc/update-manager:ro
      # Optional: third-party repos (Docker, Tailscale, VS Code, etc.) sign
      # with a key referenced by an absolute "signed-by=" path baked into
      # sources.list.d, so — unlike the mounts above — these must land at
      # the *same* absolute path in the container, not under /host. Without
      # them, apt-get update fails signature verification for any repo
      # using signed-by=/etc/apt/keyrings/... or /usr/share/keyrings/...;
      # official Ubuntu repos are unaffected either way.
      - /etc/apt/keyrings:/etc/apt/keyrings:ro
      - /usr/share/keyrings:/usr/share/keyrings:ro
      # Optional: same reasoning for repos using the older trusted.gpg.d
      # mechanism instead of signed-by= (e.g. some Microsoft repos). This
      # replaces rather than merges with the image's own trusted.gpg.d —
      # safe as long as ubuntu-keyring is present on the host (default on
      # any stock Ubuntu install), since that's what verifies the official
      # Ubuntu repos themselves.
      - /etc/apt/trusted.gpg.d:/etc/apt/trusted.gpg.d:ro
      # Container-owned state: last-known status (for diffing across
      # restarts), the agent's own apt package-list cache, and the Unix
      # socket a host-native companion (see companion/) uses to fetch this
      # agent's identity without it ever touching the network. A bind mount
      # at a fixed, predictable path -- not a named volume -- specifically
      # so a companion running natively on this same host can reach the
      # same directory. Override with STATE_DIR=<path> if you need a
      # different location (matching COMPANION_SOCKET_PATH/STATE_FILE on
      # the agent side, and install.sh's discovery, if you do).
      - ${STATE_DIR:-/var/lib/update-detector}:/var/lib/update-detector
